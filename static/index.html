<!DOCTYPE html>
<html class="bg-black">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <head>
    <link rel="stylesheet" href="./style.css" />
    <style>
    /* Only palette colors may reach the screen (docs/art-guide.md): never
       interpolate pixels when images are scaled for the device */
    img,
    canvas,
    .crisp-edges {
      image-rendering: pixelated;
    }
    @font-face {
      font-family: "8bit";
      src: url(./font/vaticanus.woff) format("woff");
    }
    .font-8bit {
      font-family: "8bit", sans-serif;
    }
    /* The 8bit font is drawn on an 8px grid (1024 units per em, 128 units
       per pixel), so it is only used at 8px or 16px */
    .pixel-text {
      font-family: "8bit", monospace;
      font-size: 16px;
      line-height: 16px;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }
    .pixel-text-sm {
      font-size: 8px;
      line-height: 8px;
    }
    /* Inks: the glyphs pass through a filter that keeps a pixel only when
       it is at least half covered and paints it with one exact palette
       color, so no anti-aliased in-between colors reach the screen */
    .ink-white {
      filter: url(#ink-white);
    }
    .ink-light {
      filter: url(#ink-light);
    }
    .ink-mid {
      filter: url(#ink-mid);
    }
    </style>
  </head>
  <body
    class="js-key-monitor js-swipe-handler js-sound-player"
    style="overscroll-behavior-y: none; overscroll-behavior-x: none; min-height: 100svh; touch-action: manipulation"
  >
    <!-- The ink filters for .ink-* (see the style above) -->
    <svg width="0" height="0" class="absolute" aria-hidden="true">
      <defs>
        <filter id="ink-white" color-interpolation-filters="sRGB">
          <feComponentTransfer in="SourceAlpha" result="mask">
            <feFuncA type="discrete" tableValues="0 1" />
          </feComponentTransfer>
          <feFlood flood-color="#ffffff" />
          <feComposite in2="mask" operator="in" />
        </filter>
        <filter id="ink-light" color-interpolation-filters="sRGB">
          <feComponentTransfer in="SourceAlpha" result="mask">
            <feFuncA type="discrete" tableValues="0 1" />
          </feComponentTransfer>
          <feFlood flood-color="#b9bcb9" />
          <feComposite in2="mask" operator="in" />
        </filter>
        <filter id="ink-mid" color-interpolation-filters="sRGB">
          <feComponentTransfer in="SourceAlpha" result="mask">
            <feFuncA type="discrete" tableValues="0 1" />
          </feComponentTransfer>
          <feFlood flood-color="#6a6d6a" />
          <feComposite in2="mask" operator="in" />
        </filter>
      </defs>
    </svg>
    <div
      class="pixel-text pixel-text-sm ink-mid relative flex items-center justify-between w-full max-w-[450px] py-1 select-none"
    >
      <div>
        <span>FPS <span class="js-fps-monitor"></span>/<span
            class="js-v-monitor"
          ></span>
        </span>
        <span>ACTORS <span class="js-actors-counter"></span></span>
        <span>ITEMS <span class="js-items-counter"></span></span>
        <span>PROPS <span class="js-props-counter"></span></span>
        <span>VERSION BUILD_DATE</span>
      </div>
      <span class="js-loading-indicator hidden">LOADING</span>
    </div>

    <div
      class="js-game-screen js-item-get-effector relative h-[320px] w-[320px] overflow-hidden"
    >
      <!-- FieldBlocks loaded in this div -->
      <div class="field absolute"></div>
      <canvas
        class="canvas-entity absolute crisp-edges"
        width="320"
        height="320"
      ></canvas>
      <!-- The ui panel -->
      <div
        class="ui-panel js-apple-counter absolute px-0.5 bg-black right-[4px] top-[4px] h-[136px] w-[64px]"
      >
        <p class="mt-0.5 flex items-start gap-1">
          <img class="inline" src="./item/apple.png" />
          <span class="count-label pixel-text ink-light">0</span>
        </p>
        <p class="mt-0.5 flex items-start gap-1">
          <img class="inline" src="./item/green-apple.png" />
          <span class="green-apple-count-label pixel-text ink-light">0</span>
        </p>
        <p class="mt-0.5 flex items-start gap-1">
          <img class="inline" src="./item/coin.png" />
          <span class="coin-count-label pixel-text ink-light">0</span>
        </p>
        <p class="mt-0.5 flex items-start gap-1">
          <img class="inline" src="./item/seed.png" />
          <span class="seed-count-label pixel-text ink-light">0</span>
        </p>
        <p class="mt-0.5 flex items-start gap-1">
          <img class="inline" src="./item/key.png" />
          <span class="key-count-label pixel-text ink-light">0</span>
        </p>
      </div>
      <!-- The exit button -->
      <div
        class="ui-panel js-exit-button absolute left-[4px] top-[4px] h-6 w-6"
      >
        <button
          class="absolute p-1 bg-[#9d285c] focus:outline-none focus:ring-0"
        >
          <img src="./prop/exit.png" />
        </button>
      </div>
      <!-- The minimap -->
      <div
        class="ui-panel js-minimap absolute right-[4px] top-[144px] bg-black p-0.5 select-none"
      >
        <canvas class="crisp-edges block" width="50" height="50"></canvas>
      </div>
      <!-- Where the player is: block-room and local coordinates -->
      <div
        class="js-place-label hidden absolute left-[4px] bottom-[4px] px-0.5 py-0.5 bg-black pixel-text pixel-text-sm pointer-events-none select-none"
      >
        <span class="js-place-text pixel-text pixel-text-sm ink-mid"></span>
      </div>
      <!-- The message toast -->
      <div
        class="js-message-toast hidden absolute bottom-[12px] left-[16px] right-[16px] text-center pointer-events-none select-none"
      >
        <span class="inline-block px-2 py-1 bg-black"><span
            class="js-message-text pixel-text ink-white"
          ></span></span>
      </div>
      <!-- Black curtain in front of the game screen -->
      <div
        class="curtain absolute w-full h-full bg-black pointer-events-none"
        style="opacity: 1"
      ></div>
    </div>
    <div
      class="w-full text-center pixel-text ink-mid fixed bottom-5 sm:hidden select-none"
    >
      SWIPE AND HOLD TO MOVE
    </div>
    <div
      class="pixel-text ink-mid hidden sm:block mt-1 select-none"
    >
      USE ARROW KEYS TO MOVE
    </div>
  </body>
  <script type="module" src="./main.js"></script>
</html>
