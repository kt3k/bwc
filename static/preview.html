<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bwc preview</title>
    <style>
    @font-face {
      font-family: "8bit";
      src: url(./font/vaticanus.woff) format("woff");
    }
    body {
      background: #000;
      color: #b9bcb9;
      font-family: "8bit", monospace;
      margin: 0;
      padding: 16px;
    }
    a {
      color: #cceaff;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }
    h2 {
      font-size: 16px;
      color: #d49d29;
      border-bottom: 1px solid #4a4d4a;
      padding-bottom: 4px;
      margin: 28px 0 12px;
    }
    .lead {
      font-size: 12px;
      color: #6a6d6a;
      margin-bottom: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 8px;
    }
    .card {
      border: 1px solid #4a4d4a;
      padding: 8px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .card canvas {
      image-rendering: pixelated;
      background: #4a4d4a;
      flex: none;
    }
    .card .name {
      font-size: 13px;
      color: #fff;
      word-break: break-all;
    }
    .card .flags {
      font-size: 10px;
      color: #7bc212;
      margin: 2px 0;
    }
    .card .note {
      font-size: 10px;
      color: #6a6d6a;
      line-height: 1.5;
    }
    </style>
  </head>
  <body>
    <h1>bwc PREVIEW</h1>
    <div class="lead">
      All cells / items / props / actors in the catalog, with their
      behaviors.
      <a href="./#10010,10004">OPEN THE INTERACTIVE ZOO &rarr;</a>
      (every entity placed live in a showcase block)
    </div>
    <div id="app">loading...</div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
